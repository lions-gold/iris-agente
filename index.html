    <script>
      // Ignore benign HMR/WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('@vite/client') || e.message.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('@vite/client') || reason.includes('createWebSocketModuleRunnerTransport'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
