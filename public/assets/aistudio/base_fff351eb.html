<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockLlave</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 14px 24px; }
    header a { color: #fff; text-decoration: none; font-size: 22px; font-weight: bold; }
    main { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #e8edf3; }
    .card { background: #fff; padding: 16px; margin-bottom: 20px; border-radius: 6px; }
    input, button { padding: 8px; font-size: 15px; }
    button { border: 0; border-radius: 4px; color: #fff; cursor: pointer; }
    .entrada { background: #2e8b57; }
    .salida { background: #c0392b; }
    .azul { background: #1f3a5f; }
    .msg { background: #fff3cd; padding: 10px; margin-bottom: 12px; border-radius: 4px; }
    .tallas input { width: 60px; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">&#128273; StockLlave</a></header>
  <main>
    {% with mensajes = get_flashed_messages() %}
      {% for m in mensajes %}<div class="msg">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
